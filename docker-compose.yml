services:
  database:
    image: postgres:15-alpine
    container_name: jjtech_pg
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER in the local .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in the local .env file}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB in the local .env file}
    volumes:
      - jjtech_data:/var/lib/postgresql/data

volumes:
  jjtech_data: